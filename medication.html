<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medikament Details | Abnehmspritzen-top.de</title>
    <link rel="canonical" href="https://abnehmspritzen-top.de/medication.html" />
    <link rel="alternate" hreflang="de" href="https://abnehmspritzen-top.de/medication.html" />
    <link rel="alternate" hreflang="x-default" href="https://abnehmspritzen-top.de/medication.html" />
    <!-- Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="data.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0fdf4',
                            100: '#dcfce7',
                            200: '#bbf7d0',
                            500: '#22c55e',
                            600: '#16a34a',
                            700: '#15803d',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
    </style>
    <!-- Schema.org Organization Markup -->
    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Abnehmspritzen-top.de",
        "url": "https://abnehmspritzen-top.de/",
        "logo": "https://abnehmspritzen-top.de/images/logo.jpg"
    }
    </script>
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="manifest" href="/site.webmanifest">
</head>

<body class="bg-gray-50 text-gray-800 antialiased min-h-screen flex flex-col">
    <!-- HEADER -->
    <header class="bg-white border-b border-gray-200 sticky top-0 z-50">
        <div class="container mx-auto px-4 max-w-6xl">
            <div class="flex justify-between items-center h-16">
                <div class="flex items-center space-x-4">
                    <a href="https://abnehmspritzen-top.de/" class="flex items-center">
                        <img src="images/logo.jpg" alt="Die Top 5 Abnehmspritzen & Medikamente 2026"
                            class="h-10 w-auto">
                    </a>
                </div>

                <nav class="hidden md:flex items-center space-x-8">
                    <a href="https://abnehmspritzen-top.de/#about"
                        class="text-sm font-medium text-gray-600 hover:text-brand-600 transition-colors">About</a>
                    <a href="https://abnehmspritzen-top.de/#contact"
                        class="text-sm font-medium text-gray-600 hover:text-brand-600 transition-colors">Contact</a>
                </nav>

                <!-- Mobile menu toggle button -->
                <button class="md:hidden p-2 text-gray-600 hover:text-brand-600">
                    <i data-lucide="menu"></i>
                </button>
            </div>
        </div>
    </header>

    <main class="flex-grow pb-24" id="content">
        <!-- Content will be injected here via JS -->
    </main>
    hhhh
    <!-- FOOTER -->
    <footer class="bg-white border-t border-gray-100 py-12 mt-auto">
        <div class="container mx-auto px-4 flex flex-col items-center">
            <nav class="flex space-x-8 mb-6">
                <a href="https://abnehmspritzen-top.de/"
                    class="text-sm font-bold text-gray-500 hover:text-brand-600 transition-colors uppercase tracking-widest no-underline">Startseite</a>
                <a href="https://abnehmspritzen-top.de/about.html"
                    class="text-sm font-bold text-gray-500 hover:text-brand-600 transition-colors uppercase tracking-widest no-underline">Über
                    uns</a>
                <a href="https://abnehmspritzen-top.de/#contact"
                    class="text-sm font-bold text-gray-500 hover:text-brand-600 transition-colors uppercase tracking-widest no-underline">Kontakt</a>
            </nav>
            <div class="text-sm font-medium text-gray-400">
                &copy; 2026 Abnehmspritzen-top.de. Alle Rechte vorbehalten.
            </div>
        </div>
    </footer>

    <script>
        // Get Medication ID from URL
        const urlParams = new URLSearchParams(window.location.search);
        const medId = urlParams.get('id');

        let med = null;
        if (window.medications && medId) {
            med = window.medications.find(m => m.id === medId);
        }

        const contentDiv = document.getElementById('content');

        if (!med) {
            contentDiv.innerHTML = `
                <div class="container mx-auto text-center py-24">
                    <h1 class="text-4xl font-bold mb-4">Medikament nicht gefunden</h1>
                    <a href="https://abnehmspritzen-top.de/" class="text-brand-600 underline">Zurück zur Startseite</a>
                </div>
            `;
            lucide.createIcons();
        } else {
            document.title = `${med.name} | Abnehmspritzen-top.de`;
            const isOral = med.id.includes('oral') || med.id.includes('mysimba');
            const iconType = isOral ? 'pill' : 'syringe';
            const typeText = isOral ? 'Oral Tablet' : 'Injection';

            contentDiv.innerHTML = `
                <!-- Hero section for Article -->
                <div class="bg-gradient-to-br from-green-800 to-teal-900 text-white py-16 lg:py-24">
                    <div class="container mx-auto px-4 max-w-6xl flex flex-col md:flex-row items-center gap-12">
                        <div class="flex-1">
                            <a href="https://abnehmspritzen-top.de/" class="inline-flex items-center text-green-200 hover:text-white mb-8 transition-colors text-sm font-medium">
                                <i data-lucide="arrow-left" class="w-4 h-4 mr-2"></i>
                                Zurück zur Übersicht
                            </a>
                            
                            <div class="flex items-center space-x-3 mb-6">
                                <span class="px-3 py-1 bg-white/10 rounded-full text-xs font-semibold backdrop-blur-sm flex items-center">
                                    <i data-lucide="${iconType}" class="w-3 h-3 mr-1.5"></i>
                                    ${typeText}
                                </span>
                            </div>
                            
                            <h1 class="text-4xl md:text-5xl lg:text-6xl font-extrabold mb-6 leading-tight">
                                ${med.name}
                            </h1>
                            
                            <p class="text-lg md:text-xl text-green-50 max-w-3xl leading-relaxed opacity-90">
                                ${med.description}
                            </p>
                        </div>
                        <div class="w-full md:w-1/3 max-w-sm rounded-2xl overflow-hidden shadow-2xl border-4 border-white/20 hidden md:block">
                            <img src="${med.image}" alt="${med.name}" class="w-full h-auto object-cover bg-white">
                        </div>
                    </div>
                </div>

                <!-- Article Content -->
                <div class="container mx-auto px-4 max-w-4xl -mt-8">
                    <div class="bg-white rounded-2xl shadow-xl border border-gray-100 p-8 md:p-12">
                        
                        <div class="grid md:grid-cols-2 gap-8 mb-12">
                            <!-- Active Ingredient -->
                            <div class="bg-gray-50 rounded-xl p-6 border border-gray-100">
                                <div class="flex items-center mb-3">
                                    <div class="w-10 h-10 rounded-full bg-blue-100 text-blue-600 flex items-center justify-center mr-4">
                                        <i data-lucide="activity" class="w-5 h-5"></i>
                                    </div>
                                    <h3 class="text-lg font-bold text-gray-800">Active Ingredient</h3>
                                </div>
                                <p class="text-gray-600 leading-relaxed pl-14">
                                    ${med.activeIngredient}
                                </p>
                            </div>

                            <!-- Efficacy -->
                            <div class="bg-green-50 rounded-xl p-6 border border-green-100">
                                <div class="flex items-center mb-3">
                                    <div class="w-10 h-10 rounded-full bg-green-200 text-green-700 flex items-center justify-center mr-4">
                                        <i data-lucide="check-circle" class="w-5 h-5"></i>
                                    </div>
                                    <h3 class="text-lg font-bold text-gray-800">Proven Efficacy</h3>
                                </div>
                                <p class="text-green-800 leading-relaxed pl-14 font-medium">
                                    ${med.efficacy}
                                </p>
                            </div>
                        </div>

                        <div class="space-y-12">
                            <section>
                                <h2 class="text-2xl font-bold text-gray-800 mb-4 pb-2 border-b border-gray-100">
                                    Mechanism of Action
                                </h2>
                                <p class="text-lg text-gray-600 leading-relaxed">
                                    ${med.mechanism}
                                </p>
                            </section>

                            <section>
                                <div class="flex items-center mb-4 pb-2 border-b border-gray-100">
                                    <h2 class="text-2xl font-bold text-gray-800">
                                        Status in Germany (2026)
                                    </h2>
                                </div>
                                <div class="flex items-start bg-amber-50 rounded-xl p-6 border border-amber-100">
                                    <i data-lucide="alert-circle" class="text-amber-600 mt-1 mr-4 flex-shrink-0 w-6 h-6"></i>
                                    <p class="text-lg text-amber-900 leading-relaxed font-medium">
                                        ${med.status}
                                    </p>
                                </div>
                            </section>
                        </div>
                        
                        <div class="mt-16 pt-8 border-t border-gray-100 flex flex-col sm:flex-row justify-between items-center text-gray-500 text-sm">
                            <div class="flex items-center mb-4 sm:mb-0">
                                <i data-lucide="clock" class="w-4 h-4 mr-2"></i>
                                Last updated: March 2026
                            </div>
                            <div>
                                Evidence-based medical review
                            </div>
                        </div>
                        
                    </div>
                </div>
            `;
            lucide.createIcons();
        }
    </script>
</body>

</html>
